receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  batch:
    timeout: 1s
exporters:
  logzio/logs:
    account_token: ${env:LOGZIO_LOGS_TOKEN}
    region: ${env:LOGZIO_REGION}
    timeout: 10s
  logzio/traces:
    account_token: ${env:LOGZIO_TRACES_TOKEN}
    region: ${env:LOGZIO_REGION}
    timeout: 10s
extensions:
  health_check:
    endpoint: 127.0.0.1:13133
service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logzio/logs]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logzio/traces]
  telemetry:
    logs:
      level: warn
